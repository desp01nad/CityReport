name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            code/user_api/requirements.txt
            code/admin_dashboard/requirements.txt
            code/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r user_api/requirements.txt -r admin_dashboard/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest
